<div class="max-w-4xl mx-auto p-8 bg-white rounded-lg shadow-md my-3.5">
  <h2 class="text-2xl font-bold mb-6">Registration Form</h2>

  <form class="space-y-6 flex flex-col items-center" #form="ngForm" (ngSubmit)="onSubmit()" >
    <div class="grid grid-cols-2 md:grid-cols-2 gap-4">
      <div>
        <label class="block mb-2 text-sm font-medium" for="Fname">
          First Name  
          <span class="text-red-600">*</span>         
        </label>
        <input 
        type="text" 
        name="Fname" 
        id="Fname" 
        #Fname="ngModel"
        minlength="3"
        required
        value={{userData.Fname}}
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)] = 'userData.Fname'
        >
        @if(Fname.touched && Fname.errors?.['required']){
            <p class="text-red-600">Form bharo</p>
        }
        @else if(Fname.errors?.['minlength']){
            <p class="text-red-600">Name should contain atleast 3 characters</p>
        }
      </div>
      <div>
        <label class="block mb-2 text-sm font-medium" for="Lname">
          Last Name 
        </label>
        <input 
        type="text" 
        name="Lname" 
        id="Lname" 
        maxlength="10"
        value={{userData.Lname}}
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)] = 'userData.Lname'
        >
      </div>
      <div>
        <label class="block mb-2 text-sm font-medium" for="age">
         Age 
          <span class="text-red-600">*</span>
        </label>
        <input 
        type="number" 
        name="age" 
        id="age" 
        required
        value={{userData.age}}
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)] = 'userData.age'
        >
      </div>
      <div>
        <label class="block mb-2 text-sm font-medium" for="city">
          City
        </label>
        <input 
        type="text" 
        name="city" 
        id="city" 
        value={{userData.city}}
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)] = 'userData.city'
        >
      </div>
      <div>
        <label class="block mb-2 text-sm font-medium" for="state">
          State
        </label>
        <select 
        name="state" 
        id="state" 
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)] = 'userData.state'
        >
            <option value="Maharashtra">Maharashtra</option>
            <option value="Gujarat">Gujarat</option>
            <option value="West bengal">West bengal</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Tamilnadu">Tamilnadu</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
        </select>
      </div>
      </div>
      <!-- <button class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700" (click)="onSubmit()">Submit</button> -->
      <app-button [btnText]="'Submit'" [btnCss]="'px-3 py-2 rounded text-white bg-green-600'" (trigger)="onSubmit()"></app-button>
      <app-button [btnText]="'Edit'" [btnCss]="'px-4 py-2 rounded text-white bg-blue-500'" (trigger)="onEdit(text)"></app-button>
      </form>
      </div>
